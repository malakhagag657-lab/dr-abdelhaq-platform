<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية الاحترافية - المنصة التعليمية</title>
    
    <!-- خط Cairo الاحترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #070d1b;
            --card-bg: #0f172a;
            --border-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #7dd3fc;
            --primary-color: #0ea5e9;
            --primary-hover: #0284c7;
            --table-header-bg: #1e293b;
            --hover-color: rgba(56, 189, 248, 0.08);
            --card-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.15);
        }

        .light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #0284c7;
            --text-main: #0f172a;
            --text-muted: #0369a1;
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --table-header-bg: #e0f2fe;
            --hover-color: rgba(2, 132, 199, 0.05);
            --card-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', Tahoma, sans-serif;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            padding: 25px;
            direction: rtl;
            min-height: 100vh;
        }

        /* شريط الإدارة العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            flex-wrap: wrap;
            gap: 15px;
        }

        .top-bar h2 {
            color: var(--primary-color);
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .theme-toggle {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            background: var(--hover-color);
        }

        /* كروت الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--card-shadow);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: rgba(56, 189, 248, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--primary-color);
        }

        .stat-info h3 {
            font-size: 28px;
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 2px;
        }

        .stat-info p {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
        }

        /* صندوق المحتوى الرئيسي */
        .section-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-header h3 {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-wrapper {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border-radius: 14px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            outline: none;
            font-size: 14px;
        }

        /* الجدول الشامل */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        td {
            padding: 15px;
            border-bottom:
